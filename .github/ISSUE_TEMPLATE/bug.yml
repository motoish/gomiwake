name: Bug report / 不具合報告
description: Report a website, calendar output, or build problem.
title: '[Bug] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      description: Include expected and actual behavior; omit personal information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, calendar app, OS, or Node version / 利用環境
    validations:
      required: true
