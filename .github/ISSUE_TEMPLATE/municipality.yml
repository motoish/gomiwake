name: Tokorozawa district request / 所沢市の地区追加
description: Request a collection district within Tokorozawa, Saitama. Other municipalities are out of scope.
title: '[Area] '
body:
  - type: input
    id: area
    attributes:
      label: Tokorozawa collection district / 所沢市の収集地区
      description: Only districts within Tokorozawa, Saitama. Do not include a street address or personal information.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official schedule URL / 公式日程のURL
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Structured data and redistribution terms / 機械可読データ・利用条件
      description: Link applicable terms if known; otherwise say unconfirmed.
